<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>WildLingo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">

      var script = document.createElement("script");
      script.async = 1;

    <!-- Non-blocking font load: loads as print stylesheet, swaps to all when ready -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
    </noscript>
    <!-- Inline critical CSS: prevents FOUC before React hydrates -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#0a1628;color:#e2e8f0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
      #root{height:100%;display:flex;flex-direction:column}
      .splash{position:fixed;inset:0;background:linear-gradient(135deg,#0a1628 0%,#0d2137 50%,#0a1628 100%);display:flex;align-items:center;justify-content:center;z-index:9999}
      .splash-inner{text-align:center;animation:spl .4s ease}
      @keyframes spl{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
      .splash-icon{font-size:64px;margin-bottom:12px;animation:bounce 1s ease infinite alternate}
      @keyframes bounce{to{transform:translateY(-8px)}}
      .splash-title{font-size:2rem;font-weight:900;background:linear-gradient(90deg,#10b981,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
      .splash-sub{color:#94a3b8;font-size:.9rem;margin-bottom:20px}
      .splash-loader{display:flex;gap:6px;justify-content:center}
      .splash-dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:dot 1s ease infinite}
      .splash-dot:nth-child(2){animation-delay:.2s}
      .splash-dot:nth-child(3){animation-delay:.4s}
      @keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
      .page-loading{display:flex;align-items:center;justify-content:center;min-height:40vh;color:#94a3b8;font-size:.9rem}
      .page-loading::after{content:'';width:20px;height:20px;border:2px solid rgba(16,185,129,.3);border-top-color:#10b981;border-radius:50%;animation:spin .7s linear infinite;margin-left:10px}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head> 
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
