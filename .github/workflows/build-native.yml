name: Build WildSphere Native Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Root Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install -g vite
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build Web Code
        run: |
          if [ -d "artifacts/animal-x" ]; then
            cd artifacts/animal-x
            npm install --include=dev --legacy-peer-deps
            npx vite build || npm run build
            cd ../..
            mkdir -p dist
            cp -r artifacts/animal-x/dist/* dist/ 2>/dev/null || cp -r artifacts/animal-x/build/* dist/ 2>/dev/null || true
          else
            npm run build
          fi

      - name: Verify Web Dist
        run: |
          ls -la dist/ || (echo "dist not found" && exit 1)

      - name: Initialize & Sync Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Native APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Native-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Bundle File
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Native-AAB
          path: android/app/build/outputs/bundle/debug/app-debug.aab

