name: Build WildSphere Native Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 for styleText support)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm & Root Tools
        run: |
          npm install -g pnpm@latest vite
          pnpm install --no-frozen-lockfile || true
          pnpm add -w @capacitor/core @capacitor/cli @capacitor/android || npm install @capacitor/core @capacitor/cli @capacitor/android --no-save --legacy-peer-deps || true

            - name: Build Web Code
        run: |
          pnpm --filter animal-x build || (cd artifacts/animal-x && pnpm build)
          rm -rf dist
          mkdir -p dist
          if [ -d "artifacts/animal-x/dist" ]; then
            cp -r artifacts/animal-x/dist/* dist/
          fi

      - name: Verify Web Dist
        run: |
          ls -la dist/
          test -f dist/index.html || (echo "index.html missing from dist!" && exit 1)

      - name: Initialize & Sync Android Platform
        run: |
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.wildsphere.animals",
            "appName": "WildSphere",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android || true
          npx cap sync android

      - name: Build Native APK & AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew bundleRelease || ./gradlew bundle || true

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Native-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Bundle File
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Native-AAB
          path: android/app/build/outputs/bundle/**/*.aab
        continue-on-error: true
