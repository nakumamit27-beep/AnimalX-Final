name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Generate, Fix WebView and Compile APK
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # 1. Fix resource names
          find app/src/main/res -type f -name "[0-9]*.png" -delete
          
          # 2. Enable DOM Storage, Database and Mixed Content in MainActivity.java
          MAIN_JAVA=$(find app/src/main/java -name "MainActivity.java")
          sed -i '/setJavaScriptEnabled(true);/a \
                  webSettings.setDomStorageEnabled(true);\
                  webSettings.setDatabaseEnabled(true);\
                  webSettings.setAllowFileAccess(true);\
                  webSettings.setAllowContentAccess(true);' "$MAIN_JAVA"

          # 3. Fix line endings and permissions
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          
          # 4. Compile APK
          ./gradlew assembleDebug --stacktrace

      - name: Upload WildSphere APK
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-APK
          path: build_output/WildSphere/android/source/app/build/outputs/apk/**/*.apk
