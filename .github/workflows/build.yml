name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Generate and Compile Android App
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload WildSphere APK
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-APK
          path: build_output/WildSphere/android/source/app/build/outputs/apk/**/*.apk
