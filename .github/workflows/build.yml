name: Build Pure Standalone Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pure App (Bypass Local Photos & Download Real Logo)
        shell: bash
        run: |
          mkdir -p app/src/main/assets/public

          # 1. Dist files find karein
          INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | grep -E "dist|artifacts" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | head -n 1)
          fi
          
          DIST_DIR=$(dirname "$INDEX_PATH")

          # 2. Strict Bypass: Saari photos, animals, aur heavy storage ko exclude karein
          rsync -av \
            --exclude='*animals*' \
            --exclude='*photos*' \
            --exclude='*1679*' \
            --exclude='*app_storage*' \
            --exclude='*.webp' \
            --exclude='*.jpg' \
            --exclude='*.jpeg' \
            --exclude='*.zip' \
            "$DIST_DIR/" app/src/main/assets/public/

          if [ -d "artifacts/animal-x/public" ]; then
            rsync -av \
              --exclude='*animals*' \
              --exclude='*photos*' \
              --exclude='*1679*' \
              --exclude='*app_storage*' \
              --exclude='*.webp' \
              --exclude='*.jpg' \
              --exclude='*.jpeg' \
              --exclude='*.zip' \
              artifacts/animal-x/public/ app/src/main/assets/public/
          fi

          if [ -d "app/src/main/assets/public/public" ]; then
            cp -rn app/src/main/assets/public/public/* app/src/main/assets/public/ 2>/dev/null || true
          fi

          # 3. Clean local heavy media from assets
          rm -rf app/src/main/assets/public/animals
          rm -rf app/src/main/assets/public/*photos*
          rm -rf app/src/main/assets/public/*1679*
          rm -rf app/src/main/assets/public/*app_storage*
          find app/src/main/assets -type f \( -name "*.webp" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.zip" \) -delete 2>/dev/null || true

          # 4. Relative paths fix
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|href="/|href="./|g' {} +
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|src="/|src="./|g' {} +
          find app/src/main/assets/public -name "*.js" -exec sed -i 's|"/assets/|"./assets/|g' {} + 2>/dev/null || true

          # 5. Styles.xml ensure karein
          mkdir -p app/src/main/res/values
          cat << 'INNER_EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          INNER_EOF

          # 6. Logo Fetcher: Manifest/Web Link ya Local file se Real PNG icon load karein
          rm -rf app/src/main/res/mipmap-* app/src/main/res/drawable*
          mkdir -p app/src/main/res/drawable

          # Agar manifest me link hai ya local repo me icon-512 hai, use download/copy karein
          ICON_URL=""
          if [ -f "artifacts/animal-x/public/manifest.json" ]; then
            ICON_URL=$(grep -o '"src": *"[^"]*"' artifacts/animal-x/public/manifest.json | head -n 1 | cut -d'"' -f4)
          elif [ -f "public/manifest.json" ]; then
            ICON_URL=$(grep -o '"src": *"[^"]*"' public/manifest.json | head -n 1 | cut -d'"' -f4)
          fi

          # Agar icon link http/https se shuru hota hai toh curl se download karein
          if [[ "$ICON_URL" =~ ^http ]]; then
            echo "Downloading icon from web link: $ICON_URL"
            curl -sSL "$ICON_URL" -o app/src/main/res/drawable/ic_launcher.png
          elif [ -f "artifacts/animal-x/public/icon-512.png" ]; then
            cp artifacts/animal-x/public/icon-512.png app/src/main/res/drawable/ic_launcher.png
          elif [ -f "public/icon-512.png" ]; then
            cp public/icon-512.png app/src/main/res/drawable/ic_launcher.png
          fi

          # Agar icon png kisi wajah se compile na ho paye toh fallback vector icon ensure karein
          if [ ! -s "app/src/main/res/drawable/ic_launcher.png" ]; then
            cat << 'INNER_EOF' > app/src/main/res/drawable/ic_launcher.xml
            <vector xmlns:android="http://schemas.android.com/apk/res/android"
                android:width="108dp"
                android:height="108dp"
                android:viewportWidth="108"
                android:viewportHeight="108">
                <path android:fillColor="#0D1527" android:pathData="M0,0h108v108h-108z"/>
                <path android:fillColor="#10B981" android:pathData="M54,20 C35.2,20 20,35.2 20,54 C20,72.8 35.2,88 54,88 C72.8,88 88,72.8 88,54 C88,35.2 72.8,20 54,20 Z M54,78 C40.8,78 30,67.2 30,54 C30,40.8 40.8,30 54,30 C67.2,30 78,40.8 78,54 C78,67.2 67.2,78 54,78 Z"/>
            </vector>
  INNER_EOF
          fi

          # 7. AndroidManifest.xml
          cat << 'INNER_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:label="WildSphere"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name="app.web.happy_fd1bc.MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          INNER_EOF

      - name: Build and Sign Ultra-Lightweight APK & AAB
        shell: bash
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          mkdir -p final_bundle
          keytool -genkey -v -keystore release.keystore -alias wildsphere -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=WildSphere, OU=Dev, O=WildSphere, L=City, S=State, C=US"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" final_bundle/WildSphere-aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final_bundle/WildSphere-Release.apk final_bundle/WildSphere-aligned.apk
            rm -f final_bundle/WildSphere-aligned.apk
          fi

          RAW_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" final_bundle/WildSphere-Release.aab
            jarsigner -keystore release.keystore -storepass 123456 -keypass 123456 final_bundle/WildSphere-Release.aab wildsphere
          fi

          cp release.keystore final_bundle/playstore-release.keystore

      - name: Upload Ultra-Lightweight Release Package
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Signed-App
          path: final_bundle/*
