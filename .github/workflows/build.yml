name: Build WildSphere Native Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android Engine & Set Custom App Logo
        shell: bash
        run: |
          mkdir -p app/src/main/assets/public

          # 1. Dist assets copy
          INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | grep -E "dist|artifacts" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | head -n 1)
          fi
          DIST_DIR=$(dirname "$INDEX_PATH")

          rsync -av \
            --exclude='*animals*' \
            --exclude='*photos*' \
            --exclude='*1679*' \
            --exclude='*app_storage*' \
            --exclude='*.webp' \
            --exclude='*.zip' \
            "$DIST_DIR/" app/src/main/assets/public/

          if [ -d "artifacts/animal-x/public" ]; then
            rsync -av \
              --exclude='*animals*' \
              --exclude='*photos*' \
              --exclude='*1679*' \
              --exclude='*app_storage*' \
              --exclude='*.webp' \
              --exclude='*.zip' \
              artifacts/animal-x/public/ app/src/main/assets/public/
          fi

          if [ -d "app/src/main/assets/public/public" ]; then
            cp -rn app/src/main/assets/public/public/* app/src/main/assets/public/ 2>/dev/null || true
          fi

          rm -rf app/src/main/assets/public/animals app/src/main/assets/public/*photos* app/src/main/assets/public/*1679*

          # Relative paths fix
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|href="/|href="./|g' {} +
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|src="/|src="./|g' {} +
          find app/src/main/assets/public -name "*.js" -exec sed -i 's|"/assets/|"./assets/|g' {} + 2>/dev/null || true

          # 2. Custom Logo Set Up (res/mipmap)
          rm -rf app/src/main/res/mipmap-* app/src/main/res/drawable*
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Check for uploaded new file first, then fallback to others
          NEW_FILE=$(find . -maxdepth 1 -name "file_*.png" | head -n 1)
          LOGO_SRC=""

          if [ -n "$NEW_FILE" ] && [ -f "$NEW_FILE" ]; then
            LOGO_SRC="$NEW_FILE"
          elif [ -f "app_icon.png" ]; then
            LOGO_SRC="app_icon.png"
          elif [ -f "artifacts/animal-x/public/icon-512.png" ]; then
            LOGO_SRC="artifacts/animal-x/public/icon-512.png"
          elif [ -f "public/icon-512.png" ]; then
            LOGO_SRC="public/icon-512.png"
          fi

          if [ -n "$LOGO_SRC" ]; then
            echo "Setting up app icon using: $LOGO_SRC"
            cp "$LOGO_SRC" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # 3. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="WildSphere"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name="app.web.happy_fd1bc.MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 4. Crash-Proof Native MainActivity.java
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/app/web/happy_fd1bc

          cat << 'EOF' > app/src/main/java/app/web/happy_fd1bc/MainActivity.java
          package app.web.happy_fd1bc;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0d1527"));
                  setContentView(webView);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          "android.permission.CAMERA",
                          "android.permission.RECORD_AUDIO",
                          "android.permission.ACCESS_FINE_LOCATION",
                          "android.permission.ACCESS_COARSE_LOCATION",
                          "android.permission.READ_MEDIA_IMAGES",
                          "android.permission.READ_MEDIA_VIDEO"
                      }, 1);
                  }

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) uploadMessage.onReceiveValue(null);
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/public/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (uploadMessage == null) return;
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      uploadMessage = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 5. Clean app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "app.web.happy_fd1bc"
              compileSdk 34

              defaultConfig {
                  applicationId "app.web.happy_fd1bc"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode 18
                  versionName "18.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              implementation('androidx.appcompat:appcompat:1.6.1') {
                  exclude group: 'org.jetbrains.kotlin'
              }
              implementation('androidx.core:core:1.12.0') {
                  exclude group: 'org.jetbrains.kotlin'
              }
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF

      - name: Build and Sign Native APK & AAB
        shell: bash
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          mkdir -p final_bundle
          keytool -genkey -v -keystore release.keystore -alias wildsphere -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=WildSphere, OU=Dev, O=WildSphere, L=City, S=State, C=US"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" final_bundle/WildSphere-aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final_bundle/WildSphere-Release.apk final_bundle/WildSphere-aligned.apk
            rm -f final_bundle/WildSphere-aligned.apk
          fi

          RAW_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" final_bundle/WildSphere-Release.aab
            jarsigner -keystore release.keystore -storepass 123456 -keypass 123456 final_bundle/WildSphere-Release.aab wildsphere
          fi

          cp release.keystore final_bundle/playstore-release.keystore

      - name: Upload Signed Native App
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Signed-App
          path: final_bundle/*
