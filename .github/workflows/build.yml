name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Build Fresh Production Release with Full Permissions
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # 1. Add Android Permissions cleanly without breaking XML
          python3 - << 'EOF'
          with open("app/src/main/AndroidManifest.xml", "r") as f:
              content = f.read()
          
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          """
          if "</manifest>" in content:
              content = content.replace("</manifest>", perms + "\n</manifest>")
              with open("app/src/main/AndroidManifest.xml", "w") as f:
                  f.write(content)
          EOF

          # 2. Fix Resource Names
          find app/src/main/res -type f -name "[0-9]*.png" -delete
          
          # 3. Inject WebChromeClient for File Chooser & Geolocation
          python3 - << 'EOF'
          import glob
          files = glob.glob("app/src/main/java/**/MainActivity.java", recursive=True)
          if files:
              file_path = files[0]
              with open(file_path, "r") as f:
                  code = f.read()
              
              imports = """
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.GeolocationPermissions;
          import android.net.Uri;
          import android.content.Intent;
          """
              if "import android.webkit.WebView;" in code:
                  code = code.replace("import android.webkit.WebView;", "import android.webkit.WebView;" + imports)
              
              injection = """
                      webSettings.setDomStorageEnabled(true);
                      webSettings.setDatabaseEnabled(true);
                      webSettings.setAllowFileAccess(true);
                      webSettings.setAllowContentAccess(true);
                      webSettings.setGeolocationEnabled(true);
                      webView.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                              callback.invoke(origin, true, false);
                          }
                          @Override
                          public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {
                              Intent intent = fileChooserParams.createIntent();
                              try {
                                  startActivityForResult(intent, 1001);
                                  return true;
                              } catch (Exception e) {
                                  return false;
                              }
                          }
                      });
              """
              if "webSettings.setJavaScriptEnabled(true);" in code:
                  code = code.replace("webSettings.setJavaScriptEnabled(true);", "webSettings.setJavaScriptEnabled(true);" + injection)
              
              with open(file_path, "w") as f:
                  f.write(code)
          EOF

          # 4. Generate Fresh Release Keystore
          keytool -genkeypair -v \
            -keystore app/wildsphere-release.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 5. Configure Signing in build.gradle
          python3 - << 'EOF'
          with open("app/build.gradle", "r") as f:
              gradle = f.read()
          
          signing = """
              signingConfigs {
                  release {
                      storeFile file("wildsphere-release.jks")
                      storePassword "wildsphere123"
                      keyAlias "wildsphere"
                      keyPassword "wildsphere123"
                  }
              }
          """
          if "android {" in gradle:
              gradle = gradle.replace("android {", "android {\n" + signing)
          if "buildTypes {" in gradle:
              gradle = gradle.replace("buildTypes {", "buildTypes {\n        release { signingConfig signingConfigs.release }")
          
          with open("app/build.gradle", "w") as f:
              f.write(gradle)
          EOF

          # 6. Fix line endings & Compile both APK and AAB
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-PlayStore-Bundle
          path: |
            build_output/WildSphere/android/source/app/build/outputs/**/*.apk
            build_output/WildSphere/android/source/app/build/outputs/**/*.aab
            build_output/WildSphere/android/source/app/wildsphere-release.jks
