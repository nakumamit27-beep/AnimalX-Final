name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Latest PWABuilder CLI
        run: npm install -g @pwabuilder/cli || npm install -g pwabuilder

      - name: Build TWA Release Supporting Android 11 to 15
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # 1. Inject Modern Android 13/14/15 Photo, Video & Camera Permissions
          python3 - << 'EOF'
          with open("app/src/main/AndroidManifest.xml", "r") as f:
              xml = f.read()
          
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """
          
          # Add hardware camera features
          features = """
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
          """
          
          if "</manifest>" in xml:
              xml = xml.replace("</manifest>", permissions + features + "\n</manifest>")
              with open("app/src/main/AndroidManifest.xml", "w") as f:
                  f.write(xml)
          EOF

          # 2. Fix numeric resource filename bug
          find app/src/main/res -type f -name "[0-9]*.png" -delete

          # 3. Disable Splash Hang & Chrome Tab Popup (Force Clean Standalone)
          python3 - << 'EOF'
          import os
          for root, dirs, files in os.walk("app/src/main/res"):
              for file in files:
                  if file.endswith(".xml"):
                      p = os.path.join(root, file)
                      with open(p, "r", errors="ignore") as f:
                          c = f.read()
                      mod = False
                      if 'name="show_splash_screen">true<' in c:
                          c = c.replace('name="show_splash_screen">true<', 'name="show_splash_screen">false<')
                          mod = True
                      if 'name="fallbackType">customtabs<' in c:
                          c = c.replace('name="fallbackType">customtabs<', 'name="fallbackType">none<')
                          mod = True
                      if mod:
                          with open(p, "w") as f:
                              f.write(c)
          EOF

          # 4. Generate Production Signing Keystore
          keytool -genkeypair -v \
            -keystore app/wildsphere-release.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 5. Configure targetSdk 34 (Android 14/15 Ready) & Sign Release
          python3 - << 'EOF'
          with open("app/build.gradle", "r") as f:
              gradle = f.read()

          # Upgrade targetSdk to 34 if lower
          gradle = gradle.replace("targetSdkVersion 33", "targetSdkVersion 34")

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("wildsphere-release.jks")
                      storePassword "wildsphere123"
                      keyAlias "wildsphere"
                      keyPassword "wildsphere123"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          """
          if "android {" in gradle and "signingConfigs" not in gradle:
              gradle = gradle.replace("android {", "android {\n" + signing_block)
          
          if "buildTypes {" in gradle:
              gradle = gradle.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }")

          with open("app/build.gradle", "w") as f:
              f.write(gradle)
          EOF

          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

          # 6. Bundle Final Files
          mkdir -p final_bundle
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} final_bundle/WildSphere-Release.apk \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} final_bundle/WildSphere-PlayStore.aab \;
          cp app/wildsphere-release.jks final_bundle/wildsphere-release.jks

      - name: Upload Final Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Final-Release
          path: build_output/WildSphere/android/source/final_bundle/*
