name: Build Pure Offline Standalone Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pure Android App (Lightweight Cloudinary Mode)
        shell: bash
        run: |
          mkdir -p app/src/main/assets/public

          INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | grep -E "dist|artifacts" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | head -n 1)
          fi
          
          DIST_DIR=$(dirname "$INDEX_PATH")
          # animals folder aur dist assets copy honge, sirf heavy unmapped photo folder exclude hoga
          rsync -av --exclude='*app_storage_1679_photos*' "$DIST_DIR/" app/src/main/assets/public/

          if [ -d "artifacts/animal-x/public" ]; then
            rsync -av --exclude='*app_storage_1679_photos*' artifacts/animal-x/public/ app/src/main/assets/public/
          fi

          if [ -d "app/src/main/assets/public/public" ]; then
            cp -rn app/src/main/assets/public/public/* app/src/main/assets/public/ 2>/dev/null || true
          fi

          # Relative paths fix taaki black screen na aaye
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|href="/|href="./|g' {} +
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|src="/|src="./|g' {} +
          find app/src/main/assets/public -name "*.js" -exec sed -i 's|"/assets/|"./assets/|g' {} + 2>/dev/null || true

          # Styles.xml ensure karein
          mkdir -p app/src/main/res/values
          cat << 'INNER_EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          INNER_EOF

          # Purane corrupt icons clear karein
          rm -rf app/src/main/res/mipmap-* app/src/main/res/drawable*

          # New clean resource folders
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          # Valid PNG Generator using ImageMagick (AAPT pass guarantee, no python PIL dependency)
          ICON_SRC=""
          if [ -f "artifacts/animal-x/public/icon-512.png" ]; then
            ICON_SRC="artifacts/animal-x/public/icon-512.png"
          elif [ -f "public/icon-512.png" ]; then
            ICON_SRC="public/icon-512.png"
          elif [ -f "app_icon.png" ]; then
            ICON_SRC="app_icon.png"
          fi

          if [ -n "$ICON_SRC" ]; then
            convert "$ICON_SRC" -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 192x192 app/src/main/res/drawable/ic_launcher.png
          else
            convert -size 192x192 xc:"#10b981" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            convert -size 144x144 xc:"#10b981" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            convert -size 96x96 xc:"#10b981" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            convert -size 72x72 xc:"#10b981" app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert -size 48x48 xc:"#10b981" app/src/main/res/mipmap-mdpi/ic_launcher.png
            convert -size 192x192 xc:"#10b981" app/src/main/res/drawable/ic_launcher.png
          fi

      - name: Build and Sign Native APK & AAB
        shell: bash
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          mkdir -p final_bundle
          keytool -genkey -v -keystore release.keystore -alias wildsphere -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=WildSphere, OU=Dev, O=WildSphere, L=City, S=State, C=US"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" final_bundle/WildSphere-aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final_bundle/WildSphere-Release.apk final_bundle/WildSphere-aligned.apk
            rm -f final_bundle/WildSphere-aligned.apk
          fi

          RAW_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" final_bundle/WildSphere-Release.aab
            jarsigner -keystore release.keystore -storepass 123456 -keypass 123456 final_bundle/WildSphere-Release.aab wildsphere
          fi

          cp release.keystore final_bundle/playstore-release.keystore

      - name: Upload Signed Release Package
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Signed-App
          path: final_bundle/*
