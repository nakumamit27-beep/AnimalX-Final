name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Build Android Project with PWABuilder
        run: |
          mkdir build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          cd ..
          zip -r WildSphere-Android-Package.zip build_output

      - name: Upload WildSphere ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Package
          path: WildSphere-Android-Package.zip
