name: Build WildSphere Native Android App

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'App Live URL (Firebase ya Vercel link)'
        required: true
        default: 'https://animal-x-final-animal-x.vercel.app'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure App and Icon
        shell: bash
        run: |
          # 1. Custom Icon Setup
          rm -rf app/src/main/res/mipmap-* app/src/main/res/drawable*
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          # Auto detect any uploaded png icon
          NEW_FILE=$(find . -maxdepth 1 -name "file_*.png" | head -n 1)
          LOGO_SRC=""
          if [ -n "$NEW_FILE" ] && [ -f "$NEW_FILE" ]; then
            LOGO_SRC="$NEW_FILE"
          elif [ -f "app_icon.png" ]; then
            LOGO_SRC="app_icon.png"
          elif [ -f "artifacts/animal-x/public/icon-512.png" ]; then
            LOGO_SRC="artifacts/animal-x/public/icon-512.png"
          fi

          if [ -n "$LOGO_SRC" ]; then
            echo "Icon found: $LOGO_SRC"
            cp "$LOGO_SRC" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$LOGO_SRC" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # 2. Manifest Setup
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="WildSphere"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name="app.web.happy_fd1bc.MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. Native Full-Screen WebView (Points directly to URL)
          TARGET_URL="${{ github.event.inputs.app_url }}"
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/app/web/happy_fd1bc

          cat << EOF > app/src/main/java/app/web/happy_fd1bc/MainActivity.java
          package app.web.happy_fd1bc;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0d1527"));
                  setContentView(webView);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          "android.permission.CAMERA",
                          "android.permission.RECORD_AUDIO",
                          "android.permission.READ_MEDIA_IMAGES",
                          "android.permission.READ_MEDIA_VIDEO"
                      }, 1);
                  }

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) uploadMessage.onReceiveValue(null);
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("$TARGET_URL");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (uploadMessage == null) return;
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      uploadMessage = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 4. build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "app.web.happy_fd1bc"
              compileSdk 34

              defaultConfig {
                  applicationId "app.web.happy_fd1bc"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode 19
                  versionName "19.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation('androidx.appcompat:appcompat:1.6.1')
              implementation('androidx.core:core:1.12.0')
          }
          EOF

      - name: Build and Sign Native APK & AAB
        shell: bash
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          mkdir -p final_bundle
          keytool -genkey -v -keystore release.keystore -alias wildsphere -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=WildSphere, OU=Dev, O=WildSphere, L=City, S=State, C=US"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" final_bundle/WildSphere-aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final_bundle/WildSphere-Release.apk final_bundle/WildSphere-aligned.apk
            rm -f final_bundle/WildSphere-aligned.apk
          fi

          RAW_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" final_bundle/WildSphere-Release.aab
            jarsigner -keystore release.keystore -storepass 123456 -keypass 123456 final_bundle/WildSphere-Release.aab wildsphere
          fi

      - name: Upload Signed Native App
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Signed-App
          path: final_bundle/*
