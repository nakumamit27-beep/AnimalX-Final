name: Build Pure Offline Standalone Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Pure Offline Android Project
        shell: bash
        run: |
          mkdir -p app/src/main/assets/public

          # 1. Dist assets copy karna (1679 photos STRICT exclude)
          INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | grep -E "dist|artifacts" | head -n 1)
          if [ -z "$INDEX_PATH" ]; then
            INDEX_PATH=$(find . -name "index.html" ! -path "*/node_modules/*" ! -path "*/.git/*" | head -n 1)
          fi
          
          DIST_DIR=$(dirname "$INDEX_PATH")
          rsync -av --exclude='*1679_animal_photo*' "$DIST_DIR/" app/src/main/assets/public/

          if [ -d "artifacts/animal-x/public" ]; then
            rsync -av --exclude='*1679_animal_photo*' artifacts/animal-x/public/ app/src/main/assets/public/
          fi

          if [ -d "app/src/main/assets/public/public" ]; then
            cp -rn app/src/main/assets/public/public/* app/src/main/assets/public/ 2>/dev/null || true
          fi

          # 1679 photos delete confirm karein
          find app/src/main/assets/public -type d -name "*1679_animal_photo*" -exec rm -rf {} + 2>/dev/null || true
          find app/src/main/assets/public -type f -name "*1679_animal_photo*" -delete 2>/dev/null || true

          # 2. RELATIVE PATH FIX: Dark screen hatane ke liye paths ko ./assets me badalna
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|href="/|href="./|g' {} +
          find app/src/main/assets/public -name "*.html" -exec sed -i 's|src="/|src="./|g' {} +
          find app/src/main/assets/public -name "*.js" -exec sed -i 's|"/assets/|"./assets/|g' {} + 2>/dev/null || true

          # 3. DRAW FIX: Strict 2-Column Grid + Full Width No Black Side Bars inject karna
          python3 -c "
          import glob

          css_patch = '''
          /* FORCE 2-COLUMN & EDGE-TO-EDGE FULL WIDTH */
          html, body, #root {
            width: 100vw !important;
            max-width: 100vw !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow-x: hidden !important;
          }
          div[class*=\"max-w-\"] {
            max-width: 100% !important;
            width: 100% !important;
          }
          /* Animal Explorer Cards Grid */
          div[class*=\"grid-cols-1\"], div[class*=\"space-y-\"] > div[class*=\"rounded-\"] {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            gap: 10px !important;
            padding-left: 8px !important;
            padding-right: 8px !important;
          }
          div[class*=\"grid-cols-1\"] > div, div[class*=\"grid\"] > div {
            width: 100% !important;
            margin: 0 !important;
          }
          div[class*=\"grid\"] img {
            height: 125px !important;
            width: 100% !important;
            object-fit: cover !important;
          }
          '''

          for css_file in glob.glob('app/src/main/assets/public/**/*.css', recursive=True):
              with open(css_file, 'a', encoding='utf-8') as f:
                  f.write(css_patch)
              print('Patched CSS:', css_file)
          "

          # 4. LOGO SETUP (HD 512px Logo Lock)
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          ICON_SOURCE=""
          if [ -f "artifacts/animal-x/public/icon-512.png" ]; then
            ICON_SOURCE="artifacts/animal-x/public/icon-512.png"
          elif [ -f "public/icon-512.png" ]; then
            ICON_SOURCE="public/icon-512.png"
          elif [ -f "app_icon.png" ]; then
            ICON_SOURCE="app_icon.png"
          fi

          if [ -n "$ICON_SOURCE" ]; then
            cp "$ICON_SOURCE" app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_SOURCE" app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_SOURCE" app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_SOURCE" app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_SOURCE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp "$ICON_SOURCE" app/src/main/res/drawable/ic_launcher.png
          fi

          find app/src/main/res -name "*[0-9]*.png" ! -name "ic_launcher.png" -delete 2>/dev/null || true

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="AppTheme" parent="android:Theme.NoTitleBar.Fullscreen">
                  <item name="android:windowBackground">@android:color/black</item>
              </style>
          </resources>
          EOF

          # 5. Manifest Setup
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="WildSphere"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Native Java Setup (Smart offline loading + Responsive WebView)
          rm -rf app/src/main/java/*
          mkdir -p app/src/main/java/app/web/happy_fd1bc

          cat << 'EOF' > app/src/main/java/app/web/happy_fd1bc/MainActivity.java
          package app.web.happy_fd1bc;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          "android.permission.CAMERA",
                          "android.permission.RECORD_AUDIO",
                          "android.permission.ACCESS_FINE_LOCATION",
                          "android.permission.ACCESS_COARSE_LOCATION",
                          "android.permission.READ_MEDIA_IMAGES",
                          "android.permission.READ_MEDIA_VIDEO"
                      }, 1);
                  }

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) uploadMessage.onReceiveValue(null);
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/public/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (uploadMessage == null) return;
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      uploadMessage = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          # 7. Clean app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "app.web.happy_fd1bc"
              compileSdk 34

              defaultConfig {
                  applicationId "app.web.happy_fd1bc"
                  minSdkVersion 23
                  targetSdkVersion 34
                  versionCode 8
                  versionName "8.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }

          dependencies {
              implementation('androidx.appcompat:appcompat:1.6.1') {
                  exclude group: 'org.jetbrains.kotlin'
              }
              implementation('androidx.core:core:1.12.0') {
                  exclude group: 'org.jetbrains.kotlin'
              }
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
          }
          EOF

      - name: Build and Sign Native APK & AAB
        shell: bash
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          mkdir -p final_bundle
          keytool -genkey -v -keystore release.keystore -alias wildsphere -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=WildSphere, OU=Dev, O=WildSphere, L=City, S=State, C=US"

          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$RAW_APK" final_bundle/WildSphere-aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out final_bundle/WildSphere-Release.apk final_bundle/WildSphere-aligned.apk
            rm -f final_bundle/WildSphere-aligned.apk
          fi

          RAW_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -f "$RAW_AAB" ]; then
            cp "$RAW_AAB" final_bundle/WildSphere-Release.aab
            jarsigner -keystore release.keystore -storepass 123456 -keypass 123456 final_bundle/WildSphere-Release.aab wildsphere
          fi

      - name: Upload Signed Release Package
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Signed-App
          path: final_bundle/*
