name: Build Android WildSphere Production

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone Official Android TWA Engine & Configure
        shell: bash
        run: |
          # 1. Download official PWABuilder Android wrapper source
          git clone --depth=1 https://github.com/pwa-builder/pwabuilder-android.git app-project
          cd app-project

          # 2. Configure project variables for WildSphere
          python3 - << 'EOF'
          import json, os

          # Update string resources & app configuration
          strings_path = "app/src/main/res/values/strings.xml"
          if os.path.exists(strings_path):
              with open(strings_path, "r") as f:
                  data = f.read()
              data = data.replace("PWA Application", "WildSphere")
              data = data.replace("https://example.com", "https://happy-fd1bc.web.app")
              with open(strings_path, "w") as f:
                  f.write(data)

          # Disable splash freeze and chrome fallback
          for root, dirs, files in os.walk("app/src/main/res"):
              for file in files:
                  if file.endswith(".xml"):
                      p = os.path.join(root, file)
                      with open(p, "r", errors="ignore") as f:
                          c = f.read()
                      c = c.replace('name="show_splash_screen">true<', 'name="show_splash_screen">false<')
                      c = c.replace('name="fallbackType">customtabs<', 'name="fallbackType">none<')
                      with open(p, "w") as f:
                          f.write(c)

          # Manifest permissions for Android 11 to 15 Photo/Video Upload
          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  xml = f.read()
              perms = """
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.CAMERA" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
                  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                  <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
                  <uses-feature android:name="android.hardware.camera" android:required="false" />
              """
              xml = xml.replace("</manifest>", perms + "\n</manifest>")
              with open(manifest_path, "w") as f:
                  f.write(xml)
          EOF

          # 3. Create Master Signing Keystore
          keytool -genkeypair -v \
            -keystore app/wildsphere.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "wildsphere123" \
            -keypass "wildsphere123" \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 4. Attach Signing Config into Gradle
          python3 - << 'EOF'
          with open("app/build.gradle", "r") as f:
              gradle = f.read()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("wildsphere.jks")
                      storePassword "wildsphere123"
                      keyAlias "wildsphere"
                      keyPassword "wildsphere123"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          """
          gradle = gradle.replace("android {", "android {\n" + signing)
          gradle = gradle.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }")
          with open("app/build.gradle", "w") as f:
              f.write(gradle)
          EOF

          # 5. Build Release APK and Play Store AAB
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

          # 6. Prepare Final Output
          mkdir -p ../output_artifacts
          cp app/build/outputs/apk/release/*-release.apk ../output_artifacts/WildSphere-Release.apk || cp app/build/outputs/apk/release/*.apk ../output_artifacts/WildSphere-Release.apk
          cp app/build/outputs/bundle/release/*-release.aab ../output_artifacts/WildSphere-PlayStore.aab || cp app/build/outputs/bundle/release/*.aab ../output_artifacts/WildSphere-PlayStore.aab
          cp app/wildsphere.jks ../output_artifacts/wildsphere.jks

      - name: Upload Final Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Final-Release
          path: output_artifacts/*
