name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Android App from Cloud
        shell: bash
        run: |
          mkdir -p final_release

          # Call official Microsoft PWABuilder Cloud Packaging API
          curl -s -X POST "https://pwabuilder-cloudapk.azurewebsites.net/generateAppPackage" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "WildSphere",
              "launcherName": "WildSphere",
              "packageId": "app.web.happy_fd1bc.twa",
              "host": "happy-fd1bc.web.app",
              "startUrl": "/",
              "webManifestUrl": "https://happy-fd1bc.web.app/manifest.json",
              "display": "standalone",
              "themeColor": "#0e1117",
              "navigationColor": "#0e1117",
              "backgroundColor": "#0e1117",
              "enableNotifications": true,
              "fallbackType": "none",
              "appVersion": "1.0.0",
              "appVersionCode": 1,
              "signing": {
                "file": null,
                "alias": "wildsphere",
                "fullName": "WildSphere",
                "organization": "WildSphere",
                "organizationalUnit": "App",
                "countryCode": "IN",
                "keyPassword": "wildsphere123",
                "storePassword": "wildsphere123"
              }
            }' \
            --output app-bundle.zip

          # Unzip and organize artifacts
          unzip -o app-bundle.zip -d final_release/

      - name: Upload WildSphere Production Release
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Final-Release
          path: final_release/**
