name: Build WildSphere Standalone APK & AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Production TWA from Cloud API
        shell: bash
        run: |
          mkdir -p final_output

          # Microsoft PWABuilder Cloud API call for WildSphere
          curl -s -X POST "https://pwabuilder-cloudapk.azurewebsites.net/generateAppPackage" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "WildSphere",
              "launcherName": "WildSphere",
              "packageId": "app.web.happy_fd1bc.twa",
              "host": "happy-fd1bc.web.app",
              "startUrl": "/",
              "webManifestUrl": "https://happy-fd1bc.web.app/manifest.json",
              "display": "standalone",
              "themeColor": "#0e1117",
              "navigationColor": "#0e1117",
              "backgroundColor": "#0e1117",
              "enableNotifications": true,
              "fallbackType": "none",
              "appVersion": "1.0.0",
              "appVersionCode": 1,
              "signing": {
                "file": null,
                "alias": "wildsphere",
                "fullName": "WildSphere",
                "organization": "WildSphere",
                "organizationalUnit": "App",
                "countryCode": "IN",
                "keyPassword": "wildsphere123",
                "storePassword": "wildsphere123"
              }
            }' \
            --output app-bundle.zip

          # Unzip files
          unzip -o app-bundle.zip -d extracted/

          # Organize clean artifacts for download
          find extracted/ -name "*.apk" -exec cp {} final_output/WildSphere-Release.apk \;
          find extracted/ -name "*.aab" -exec cp {} final_output/WildSphere-PlayStore.aab \;
          find extracted/ -name "*.keystore" -o -name "*.jks" -exec cp {} final_output/wildsphere.keystore \;
          find extracted/ -name "assetlinks.json" -exec cp {} final_output/assetlinks.json \;

      - name: Upload Final Android Releases
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Final-Release
          path: final_output/*
