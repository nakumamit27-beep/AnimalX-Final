name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create twa-manifest.json
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.wildsphere.twa",
            "host": "happy-fd1bc.web.app",
            "name": "WildSphere",
            "launcherName": "WildSphere",
            "display": "standalone",
            "themeColor": "#000000",
            "themeColorDark": "#000000",
            "navigationColor": "#000000",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#FFFFFF",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://happy-fd1bc.web.app/icons/icon-512x512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://happy-fd1bc.web.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://happy-fd1bc.web.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore ./android.keystore \
            -alias android -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "password123" -keypass "password123" \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

      - name: Generate & Build Project
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "password123"
          BUBBLEWRAP_KEY_PASSWORD: "password123"
        run: |
          # Generate Android Project files from manifest
          bubblewrap update
          # Build signed APK and AAB
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-APK
          path: app-release-signed.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-AAB
          path: app-release-bundle.aab
