name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Generate Keystore, APK and Read Package Name
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # 1. Print Application ID directly in logs
          echo "=========================================="
          echo "YOUR OFFICIAL APPLICATION ID IS:"
          grep "applicationId" app/build.gradle
          echo "=========================================="
          
          # Fix resource names
          find app/src/main/res -type f -name "[0-9]*.png" -delete
          
          # Enable DOM Storage & Web features
          MAIN_JAVA=$(find app/src/main/java -name "MainActivity.java")
          sed -i '/setJavaScriptEnabled(true);/a \
                  webSettings.setDomStorageEnabled(true);\
                  webSettings.setDatabaseEnabled(true);\
                  webSettings.setAllowFileAccess(true);\
                  webSettings.setAllowContentAccess(true);' "$MAIN_JAVA"

          # 2. Create Release Keystore
          keytool -genkeypair -v \
            -keystore app/wildsphere-release.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 3. Configure signing
          sed -i '/android {/a \
              signingConfigs {\
                  release {\
                      storeFile file("wildsphere-release.jks")\
                      storePassword "wildsphere123"\
                      keyAlias "wildsphere"\
                      keyPassword "wildsphere123"\
                  }\
              }' app/build.gradle

          sed -i 's/buildTypes {/buildTypes { release { signingConfig signingConfigs.release } /' app/build.gradle

          # Fix line endings
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          
          # 4. Compile Release APK
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Final-Release
          path: |
            build_output/WildSphere/android/source/app/build/outputs/apk/**/*.apk
            build_output/WildSphere/android/source/app/wildsphere-release.jks
