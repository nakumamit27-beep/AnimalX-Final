name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Build & Digitally Sign APK and AAB
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # 1. Android Permissions (API 28+ Clean XML)
          python3 - << 'EOF'
          with open("app/src/main/AndroidManifest.xml", "r") as f:
              xml = f.read()
          
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """
          if "</manifest>" in xml:
              xml = xml.replace("</manifest>", permissions + "\n</manifest>")
              with open("app/src/main/AndroidManifest.xml", "w") as f:
                  f.write(xml)
          EOF

          # 2. Fix numeric resource assets
          find app/src/main/res -type f -name "[0-9]*.png" -delete

          # 3. Create Lifetime Release Keystore
          keytool -genkeypair -v \
            -keystore app/wildsphere-release.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 4. Build Release Package
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

          # 5. Sign the APK & AAB directly using Jarsigner (Ensures 100% Valid Signature)
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          mkdir -p final_release

          if [ -f "$APK_PATH" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore app/wildsphere-release.jks \
              -storepass wildsphere123 \
              -keypass wildsphere123 \
              "$APK_PATH" wildsphere
            cp "$APK_PATH" final_release/WildSphere-Signed-Release.apk
          fi

          if [ -f "$AAB_PATH" ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore app/wildsphere-release.jks \
              -storepass wildsphere123 \
              -keypass wildsphere123 \
              "$AAB_PATH" wildsphere
            cp "$AAB_PATH" final_release/WildSphere-Signed-Release.aab
          fi

          cp app/wildsphere-release.jks final_release/wildsphere-release.jks

      - name: Upload Final Signed Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Signed-Bundle
          path: build_output/WildSphere/android/source/final_release/*
