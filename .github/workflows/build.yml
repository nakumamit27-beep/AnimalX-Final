name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Build and Sign Production APK with apksigner
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # 1. Standard API 28 Clean Permissions
          python3 - << 'EOF'
          with open("app/src/main/AndroidManifest.xml", "r") as f:
              xml = f.read()
          
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          """
          if "</manifest>" in xml:
              xml = xml.replace("</manifest>", permissions + "\n</manifest>")
              with open("app/src/main/AndroidManifest.xml", "w") as f:
                  f.write(xml)
          EOF

          # 2. Fix numeric resource assets
          find app/src/main/res -type f -name "[0-9]*.png" -delete

          # 3. Create Release Keystore
          keytool -genkeypair -v \
            -keystore app/wildsphere-release.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 4. Compile APK and AAB
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

          # 5. Proper Alignment & V2+V3 Signing with Android apksigner
          mkdir -p final_apk
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          # Align APK
          zipalign -v -p 4 "$RAW_APK" final_apk/WildSphere-Aligned.apk

          # Sign with apksigner (Guarantees install on Android 9, 10, 11, 12, 13, 14, 15)
          apksigner sign --ks app/wildsphere-release.jks \
            --ks-key-alias wildsphere \
            --ks-pass pass:wildsphere123 \
            --key-pass pass:wildsphere123 \
            --out final_apk/WildSphere-Installable.apk \
            final_apk/WildSphere-Aligned.apk

          # Prepare AAB and Keystore for Play Store
          RAW_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/wildsphere-release.jks \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            "$RAW_AAB" wildsphere
            
          cp "$RAW_AAB" final_apk/WildSphere-PlayStore.aab
          cp app/wildsphere-release.jks final_apk/wildsphere-release.jks

      - name: Upload Installable APK & PlayStore Bundle
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Final-Release
          path: build_output/WildSphere/android/source/final_apk/*
