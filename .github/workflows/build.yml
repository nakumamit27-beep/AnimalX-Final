name: Build Android APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI & Bind SDK
        run: |
          npm install -g @bubblewrap/cli
          # Configure official Bubblewrap paths for Java & Android SDK
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Create twa-manifest.json
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "app.web.happy_fd1bc.twa",
            "host": "happy-fd1bc.web.app",
            "name": "WildSphere",
            "launcherName": "WildSphere",
            "display": "standalone",
            "themeColor": "#0e1117",
            "themeColorDark": "#0e1117",
            "navigationColor": "#0e1117",
            "navigationColorDark": "#0e1117",
            "navigationDividerColor": "#0e1117",
            "navigationDividerColorDark": "#0e1117",
            "backgroundColor": "#0e1117",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://happy-fd1bc.web.app/icons/icon-512x512.png",
            "splashScreenFadeOutDuration": 0,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://happy-fd1bc.web.app/manifest.json",
            "fallbackType": "none",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": false,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://happy-fd1bc.web.app/",
            "minSdkVersion": 21,
            "orientation": "default",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

      - name: Clean and Generate Keystore
        run: |
          rm -f ./android.keystore
          keytool -genkeypair -v \
            -keystore ./android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "wildsphere123" \
            -keypass "wildsphere123" \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

      - name: Generate & Build Project with Android 11-15 Media Permissions
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "wildsphere123"
          BUBBLEWRAP_KEY_PASSWORD: "wildsphere123"
        run: |
          # Generate Android Project files from manifest
          bubblewrap update --skipPwaValidation

          # Inject Camera and Android 11-15 Gallery/Video permissions
          python3 - << 'EOF'
          import os

          manifest_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  xml = f.read()
              permissions = """
                  <uses-permission android:name="android.permission.INTERNET" />
                  <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                  <uses-permission android:name="android.permission.CAMERA" />
                  <uses-permission android:name="android.permission.RECORD_AUDIO" />
                  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
                  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                  <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              """
              features = """
                  <uses-feature android:name="android.hardware.camera" android:required="false" />
                  <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              """
              if "</manifest>" in xml:
                  xml = xml.replace("</manifest>", permissions + features + "\n</manifest>")
                  with open(manifest_path, "w") as f:
                      f.write(xml)

          # Disable splash screen freeze
          for root, dirs, files in os.walk("app/src/main/res"):
              for file in files:
                  if file.endswith(".xml"):
                      p = os.path.join(root, file)
                      with open(p, "r", errors="ignore") as f:
                          c = f.read()
                      if 'name="show_splash_screen">true<' in c:
                          c = c.replace('name="show_splash_screen">true<', 'name="show_splash_screen">false<')
                          with open(p, "w") as f:
                              f.write(c)
          EOF

          # Build signed APK and AAB
          bubblewrap build --skipPwaValidation

          # Collect built files
          mkdir -p final_artifacts
          find . -name "*.apk" -not -path "./node_modules/*" -exec cp {} final_artifacts/WildSphere-Release.apk \;
          find . -name "*.aab" -not -path "./node_modules/*" -exec cp {} final_artifacts/WildSphere-PlayStore.aab \;
          cp ./android.keystore final_artifacts/wildsphere.keystore

      - name: Upload Final Android Releases
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Final-Release
          path: final_artifacts/*
