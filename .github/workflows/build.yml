name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download from PWABuilder API
        run: |
          mkdir -p output
          curl -s -L -X POST "https://pwabuilder-android.azurewebsites.com/api/packages" \
            -H "Content-Type: application/json" \
            -d '{
              "appUrl": "https://happy-fd1bc.web.app",
              "name": "WildSphere",
              "packageId": "com.wildsphere.app",
              "themeColor": "#000000",
              "backgroundColor": "#000000",
              "signingMode": "new",
              "signing": {
                "alias": "wildsphere",
                "keyPassword": "wildspherepass",
                "storePassword": "wildspherepass"
              }
            }' -o ./output/WildSphere-Android-Package.zip

      - name: Upload PWABuilder ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Package
          path: ./output/WildSphere-Android-Package.zip
