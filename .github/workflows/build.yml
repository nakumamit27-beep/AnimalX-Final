name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build TWA APK and AAB
        run: |
          mkdir app-build && cd app-build
          yes "" | bubblewrap init --manifest="https://happy-fd1bc.web.app/manifest.json" --chromeosonly=false || true
          bubblewrap build --skipPwaValidation || true
          cd ..

      - name: Upload WildSphere Android Files
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Files
          path: ./app-build
