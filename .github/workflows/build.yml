name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Generate Keystore, APK and AAB
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # Fix resource names
          find app/src/main/res -type f -name "[0-9]*.png" -delete
          
          # Enable DOM Storage & Web features
          MAIN_JAVA=$(find app/src/main/java -name "MainActivity.java")
          sed -i '/setJavaScriptEnabled(true);/a \
                  webSettings.setDomStorageEnabled(true);\
                  webSettings.setDatabaseEnabled(true);\
                  webSettings.setAllowFileAccess(true);\
                  webSettings.setAllowContentAccess(true);' "$MAIN_JAVA"

          # 1. Generate permanent Release Keystore inside app folder
          keytool -genkeypair -v \
            -keystore app/wildsphere-release.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 2. Configure Signing in build.gradle
          sed -i '/android {/a \
              signingConfigs {\
                  release {\
                      storeFile file("wildsphere-release.jks")\
                      storePassword "wildsphere123"\
                      keyAlias "wildsphere"\
                      keyPassword "wildsphere123"\
                  }\
              }' app/build.gradle

          sed -i 's/buildTypes {/buildTypes { release { signingConfig signingConfigs.release } /' app/build.gradle

          # Fix line endings & permissions
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          
          # Upgrade Gradle wrapper to 7.5 for AAB generation compatibility
          sed -i 's/gradle-4.6-all.zip/gradle-7.5-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/com.android.tools.build:gradle:3.2.1/com.android.tools.build:gradle:7.3.1/g' build.gradle
          
          # 3. Build Signed APK and Signed AAB
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Store-Package
          path: |
            build_output/WildSphere/android/source/app/build/outputs/apk/release/*.apk
            build_output/WildSphere/android/source/app/build/outputs/bundle/release/*.aab
            build_output/WildSphere/android/source/app/wildsphere-release.jks
