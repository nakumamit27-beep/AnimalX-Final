name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download WildSphere Android ZIP from PWABuilder
        run: |
          mkdir -p output
          curl -X POST "https://pwabuilder-cloudapk.azurewebsites.com/build" \
            -H "Content-Type: application/json" \
            -d '{
              "packageId": "com.wildsphere.app",
              "name": "WildSphere",
              "launcherName": "WildSphere",
              "webManifestUrl": "https://happy-fd1bc.web.app/manifest.json",
              "appVersion": "1.0.0",
              "versionCode": 1,
              "host": "happy-fd1bc.web.app",
              "startUrl": "/"
            }' --output ./output/WildSphere-Android.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Package
          path: ./output/WildSphere-Android.zip
