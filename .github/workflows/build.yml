name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder
        run: npm install -g pwabuilder

      - name: Generate Android Project
        run: |
          mkdir -p android-output
          pwabuilder package https://happy-fd1bc.web.app --platform android --output ./android-output

      - name: Upload WildSphere ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Android-Package
          path: ./android-output
