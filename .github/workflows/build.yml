name: Generate WildSphere Production Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PWABuilder CLI
        run: npm install -g pwabuilder

      - name: Build Production APK & AAB with Working File Picker
        shell: bash
        run: |
          mkdir -p build_output
          cd build_output
          pwabuilder https://happy-fd1bc.web.app -p android -l debug
          
          cd WildSphere/android/source
          
          # 1. Add All Android Permissions
          python3 - << 'EOF'
          with open("app/src/main/AndroidManifest.xml", "r") as f:
              xml = f.read()
          
          permissions = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          """
          if "</manifest>" in xml:
              xml = xml.replace("</manifest>", permissions + "\n</manifest>")
              with open("app/src/main/AndroidManifest.xml", "w") as f:
                  f.write(xml)
          EOF

          # 2. Fix numeric resource assets
          find app/src/main/res -type f -name "[0-9]*.png" -delete
          
          # 3. Complete File Picker & Location Implementation in MainActivity
          python3 - << 'EOF'
          import glob, re
          files = glob.glob("app/src/main/java/**/MainActivity.java", recursive=True)
          if files:
              file_path = files[0]
              with open(file_path, "r") as f:
                  code = f.read()

              # Get package name
              pkg_match = re.search(r"package\s+([^;]+);", code)
              pkg = pkg_match.group(1) if pkg_match else "com.happy_fd1bc.web.app"

              # New complete working MainActivity
              new_code = f"""package {pkg};

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {{
              private WebView mWebView;
              private ValueCallback<Uri[]> mFilePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  mWebView = new WebView(this);
                  setContentView(mWebView);

                  WebSettings webSettings = mWebView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setDatabaseEnabled(true);
                  webSettings.setAllowFileAccess(true);
                  webSettings.setAllowContentAccess(true);
                  webSettings.setGeolocationEnabled(true);
                  webSettings.setMediaPlaybackRequiresUserGesture(false);

                  mWebView.setWebViewClient(new WebViewClient());
                  mWebView.setWebChromeClient(new WebChromeClient() {{
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {{
                          callback.invoke(origin, true, false);
                      }}

                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, WebChromeClient.FileChooserParams fileChooserParams) {{
                          if (mFilePathCallback != null) {{
                              mFilePathCallback.onReceiveValue(null);
                          }}
                          mFilePathCallback = filePathCallback;

                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("*/*");
                          startActivityForResult(Intent.createChooser(intent, "Select File"), FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }}
                  }});

                  mWebView.loadUrl("https://happy-fd1bc.web.app");
              }}

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {{
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {{
                      if (mFilePathCallback != null) {{
                          Uri[] results = null;
                          if (resultCode == Activity.RESULT_OK && data != null) {{
                              if (data.getData() != null) {{
                                  results = new Uri[]{{ data.getData() }};
                              }} else if (data.getClipData() != null) {{
                                  int count = data.getClipData().getItemCount();
                                  results = new Uri[count];
                                  for (int i = 0; i < count; i++) {{
                                      results[i] = data.getClipData().getItemAt(i).getUri();
                                  }}
                              }}
                          }}
                          mFilePathCallback.onReceiveValue(results);
                          mFilePathCallback = null;
                      }}
                  }}
              }}

              @Override
              public void onBackPressed() {{
                  if (mWebView.canGoBack()) {{
                      mWebView.goBack();
                  }} else {{
                      super.onBackPressed();
                  }}
              }}
          }}
          """
              with open(file_path, "w") as f:
                  f.write(new_code)
          EOF

          # 4. Generate Fresh Release Keystore
          keytool -genkeypair -v \
            -keystore app/wildsphere-release.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          # 5. Configure Signing in build.gradle
          python3 - << 'EOF'
          with open("app/build.gradle", "r") as f:
              gradle = f.read()
          
          signing = """
              signingConfigs {
                  release {
                      storeFile file("wildsphere-release.jks")
                      storePassword "wildsphere123"
                      keyAlias "wildsphere"
                      keyPassword "wildsphere123"
                  }
              }
          """
          if "android {" in gradle:
              gradle = gradle.replace("android {", "android {\n" + signing)
          if "buildTypes {" in gradle:
              gradle = gradle.replace("buildTypes {", "buildTypes {\n        release { signingConfig signingConfigs.release }")
          
          with open("app/build.gradle", "w") as f:
              f.write(gradle)
          EOF

          # 6. Build APK & AAB
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-PlayStore-Bundle
          path: |
            build_output/WildSphere/android/source/app/build/outputs/**/*.apk
            build_output/WildSphere/android/source/app/build/outputs/**/*.aab
            build_output/WildSphere/android/source/app/wildsphere-release.jks
