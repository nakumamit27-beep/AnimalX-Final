name: Build Pure Native Offline Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Build Web Frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter animal-x run build || pnpm run build || true

      - name: Bundle Web Assets into Native Android (Excluding Heavy Photos)
        shell: bash
        run: |
          mkdir -p app/src/main/assets/public

          # Dist files copy karna (1679_animal_photo heavy folder ko skip karke)
          if [ -d "artifacts/animal-x/dist" ]; then
            rsync -av --exclude='1679_animal_photo*' artifacts/animal-x/dist/ app/src/main/assets/public/
          elif [ -d "dist" ]; then
            rsync -av --exclude='1679_animal_photo*' dist/ app/src/main/assets/public/
          fi

          # Public assets/sounds copy karna
          if [ -d "artifacts/animal-x/public" ]; then
            rsync -av --exclude='1679_animal_photo*' artifacts/animal-x/public/ app/src/main/assets/public/
          fi

          # Corrupt drawable icons hatana
          find app/src/main/res -name "*[0-9]*.png" -delete || true

      - name: Build Native APK and AAB
        shell: bash
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew clean assembleRelease bundleRelease --no-daemon

          mkdir -p output_binaries
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} output_binaries/ \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} output_binaries/ \;

      - name: Upload APK & AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Native-Release
          path: output_binaries/*
