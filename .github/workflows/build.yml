name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize and Build Android App
        run: |
          mkdir build-dir && cd build-dir
          bubblewrap init --manifest="https://happy-fd1bc.web.app/manifest.json" --directory=. --chromeosonly=false
          bubblewrap build --skipPwaValidation

      - name: Upload APK and AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Android-Files
          path: |
            build-dir/*.apk
            build-dir/*.aab
            build-dir/*.keystore
