name: Generate WildSphere Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Request PWABuilder Package
        run: |
          mkdir -p output
          curl -s -L -X POST "https://android.pwabuilder.com/api/build" \
            -H "Content-Type: application/json" \
            -d '{
              "manifestUrl": "https://happy-fd1bc.web.app/manifest.json",
              "packageId": "com.wildsphere.app",
              "name": "WildSphere",
              "launcherName": "WildSphere",
              "signingMode": "new"
            }' \
            --output ./output/WildSphere-Package.zip

      - name: Verify and Upload
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Package
          path: ./output/WildSphere-Package.zip
