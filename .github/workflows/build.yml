name: Build Pure Offline Standalone Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Native Android App & Bundling
        shell: bash
        run: |
          mkdir -p app/src/main/assets/public

          # 1. Copy Frontend inside APK assets
          if [ -d "artifacts/animal-x/dist/public" ]; then
            cp -r artifacts/animal-x/dist/public/* app/src/main/assets/public/
          elif [ -d "public" ]; then
            cp -r public/* app/src/main/assets/public/
          fi

          # 2. Overwrite AndroidManifest to pure Native (Zero Firebase, Zero Chrome)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="app.web.happy_fd1bc">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="WildSphere"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. Native MainActivity with Video Upload & Location handlers
          mkdir -p app/src/main/java/app/web/happy_fd1bc
          rm -f app/src/main/java/app/web/happy_fd1bc/*Launcher*.java

          cat << 'EOF' > app/src/main/java/app/web/happy_fd1bc/MainActivity.java
          package app.web.happy_fd1bc;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.app.ActivityCompat;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 1001;
              private final static int PERMISSION_REQUEST_CODE = 1002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  requestAppPermissions();

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) uploadMessage.onReceiveValue(null);
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                              request.grant(request.getResources());
                          }
                      }
                  });

                  webView.loadUrl("file:///android_asset/public/index.html");
              }

              private void requestAppPermissions() {
                  String[] perms = {
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION
                  };
                  ActivityCompat.requestPermissions(this, perms, PERMISSION_REQUEST_CODE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILECHOOSER_RESULTCODE) {
                      if (uploadMessage == null) return;
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      uploadMessage = null;
                  }
                  super.onActivityResult(requestCode, resultCode, data);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

      - name: Generate Master Release Keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore app/wildsphere-pure.jks \
            -alias wildsphere \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass wildsphere123 \
            -keypass wildsphere123 \
            -dname "CN=WildSphere, OU=App, O=WildSphere, L=City, S=State, C=IN"

          python3 - << 'EOF'
          with open("app/build.gradle", "r") as f:
              gradle = f.read()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("wildsphere-pure.jks")
                      storePassword "wildsphere123"
                      keyAlias "wildsphere"
                      keyPassword "wildsphere123"
                  }
              }
          """
          if "android {" in gradle and "signingConfigs" not in gradle:
              gradle = gradle.replace("android {", "android {\n" + signing)
          if "buildTypes {" in gradle:
              gradle = gradle.replace("buildTypes {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }")

          with open("app/build.gradle", "w") as f:
              f.write(gradle)
          EOF

      - name: Build Pure Native APK & AAB
        shell: bash
        run: |
          sed -i -e 's/\r$//' gradlew || true
          chmod +x gradlew || true
          ./gradlew assembleRelease bundleRelease --stacktrace

          mkdir -p final_bundle
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} final_bundle/WildSphere-Offline-Native.apk \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} final_bundle/WildSphere-PlayStore.aab \;

      - name: Upload Native Release Package
        uses: actions/upload-artifact@v4
        with:
          name: WildSphere-Pure-Native-App
          path: final_bundle/*
